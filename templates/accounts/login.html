{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="col-md-4 mx-auto card p-4">
  <h3>Login</h3>
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-0">No account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
