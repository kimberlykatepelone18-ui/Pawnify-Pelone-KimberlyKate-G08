{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="profile-card">
  <div class="profile-banner"></div>
  <div class="profile-body">
    <h1 class="mt-4">Edit profile</h1>
    <form method="post" enctype="multipart/form-data" novalidate class="mt-3">{% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <div class="profile-actions">
        <button class="btn-sage">Save changes</button>
        <a href="{% url 'profile' %}" class="btn-outline-sage btn-sage">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
